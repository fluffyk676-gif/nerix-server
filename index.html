<script>
let ws=null, myUser=null, otherPlayers=[], chatLog=[];
let authMode='login';
let allowPageScale = true;

function connectWS(){
  if (!location.host) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  try { ws = new WebSocket(proto + '//' + location.host); } catch(e){ return; }
  ws.onopen = () => { tryAutoLogin(); };
  ws.onclose = () => { setTimeout(connectWS, 2000); };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch { return; } handleServerMsg(m); };
}
function wsSend(obj){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function tryAutoLogin(){
  const saved = localStorage.getItem('nerix_login');
  if(!saved) return;
  try {
    const d = JSON.parse(saved);
    if(d.nick && d.pass){
      document.getElementById('inpNick').value = d.nick;
      document.getElementById('inpPass').value = d.pass;
      wsSend({type:'login', nick:d.nick, pass:d.pass});
    }
  } catch {}
}

function handleServerMsg(m){
  if(m.type === 'authResult'){
    const el = document.getElementById('authMsg');
    if(!m.ok){ localStorage.removeItem('nerix_login'); el.innerHTML = '<div class="err">' + m.msg + '</div>'; return; }
    myUser = m.user; enterPlatform();
  }
  if(m.type === 'userUpdate'){ myUser = m.user; refreshPlatformUI(); if(document.getElementById('page-avatar').classList.contains('on')) renderAvatarPage(); if(document.getElementById('page-catalog').classList.contains('on')) renderCatalog(); if(document.getElementById('page-friends').classList.contains('on')) renderFriends(); }
  if(m.type === 'taskNotify') toast('✅ ' + m.name + '  +' + m.reward + ' 💧');
  if(m.type === 'bonusResult') toast(m.ok ? '🎁 +50 Nerixs!' : m.msg);
  if(m.type === 'buyResult' && !m.ok) toast(m.msg);
  if(m.type === 'friendResult'){ const el = document.getElementById('friendMsg'); el.innerHTML = m.ok ? '<div class="ok">Добавлен!</div>' : '<div class="err">' + m.msg + '</div>'; if(m.ok && m.user){ myUser = m.user; renderFriends(); } }
  if(m.type === 'players') otherPlayers = m.list.filter(p => !myUser || p.nick !== myUser.nick);
  if(m.type === 'chat'){ chatLog.push(m); if(chatLog.length > 50) chatLog.shift(); renderChat(); }
}

function collideHoriz(px,pz){
  const r=0.42;
  for(const w of wallBoxes){
    const mnx=w.x-w.hw-r, mxx=w.x+w.hw+r;
    const mnz=w.z-w.hd-r, mxz=w.z+w.hd+r;
    if(px>mnx && px<mxx && pz>mnz && pz<mxz){
      const a=px-mnx, b=mxx-px, e=pz-mnz, f=mxz-pz;
      const m=Math.min(a,b,e,f);
      if(m===a) px=mnx; else if(m===b) px=mxx;
      else if(m===e) pz=mnz; else pz=mxz;
    }
  }
  px=Math.max(WB.minX,Math.min(WB.maxX,px));
  pz=Math.max(WB.minZ,Math.min(WB.maxZ,pz));
  return [px,pz];
}
function groundTop(px,pz,curY){
  let best=-100;
  for(const p of flatPlatforms){
    if(Math.abs(px-p.x) < p.hw+0.55 && Math.abs(pz-p.z) < p.hd+0.55){
      if(p.top <= curY + 0.75 && p.top > best) best = p.top;
    }
  }
  return best;
}

let last=performance.now();
let proj=persp(Math.PI/3,c.width/c.height,0.1,600);

function loop(t){
  const dt=Math.min(32,t-last); last=t; const s=dt/1000;

  if(running && bP && !gamePaused){
    const now=performance.now();

    let mx=joyX, mz=joyY;
    if(player.dead){mx=0;mz=0;}
    if(keys['w'])mz+=1; if(keys['s'])mz-=1; if(keys['a'])mx-=1; if(keys['d'])mx+=1;
    const mag=Math.hypot(mx,mz);
    if(mag>0.15 && !player.dead){
      const fwdX=-Math.sin(camYaw), fwdZ=-Math.cos(camYaw);
      const rgtX=-fwdZ, rgtZ=fwdX;
      let wx=fwdX*mz + rgtX*mx, wz=fwdZ*mz + rgtZ*mx;
      const wl=Math.hypot(wx,wz)||1; wx/=wl; wz/=wl;
      const tYaw=Math.atan2(wx,wz);
      let dy=tYaw-player.yaw;
      while(dy>Math.PI)dy-=Math.PI*2; while(dy<-Math.PI)dy+=Math.PI*2;
      player.yaw+=dy*Math.min(1,s*12);
      const [nx,nz]=collideHoriz(player.x+wx*player.speed*s, player.z+wz*player.speed*s);
      walkedAcc+=Math.hypot(nx-player.x,nz-player.z);
      player.x=nx; player.z=nz;
      player.walking=true; player.walkPhase+=s*9;
    } else player.walking=false;
    if(walkedAcc>120){wsSend({type:'stats',stats:{walked:walkedAcc}});walkedAcc=0;}

    player.vy -= GRAVITY*s;
    player.y += player.vy*s;
    const gy = groundTop(player.x, player.z, player.y);
    if(player.y <= gy + 0.12){ player.y = gy; player.vy = 0; player.onGround = true; }
    else player.onGround = false;

    if(acidY > -900 && player.y < acidY + 0.6 && !player.dead){
      player.dead = true; player.respawnAt = performance.now() + 2000;
      document.getElementById('deathScreen').classList.add('on');
      wsSend({type:'stats',stats:{die:1}});
      toast('☠ Кислота!');
    }

    if(player.y < FALL_LIMIT && !player.dead){
      player.dead=true; player.respawnAt=performance.now()+2000;
      document.getElementById('deathScreen').classList.add('on');
      wsSend({type:'stats',stats:{die:1}});
    }
    if(player.dead && performance.now() >= player.respawnAt){
      player.dead=false;
      document.getElementById('deathScreen').classList.remove('on');
      const g=GAMES[player.place]; const sp=g.build().spawn;
      player.x=sp.x; player.z=sp.z; player.y=sp.y||4; player.vy=0; player.health=100;
    }
    if(player.dead){ const left=Math.max(0,(player.respawnAt-performance.now())/1000); document.getElementById('respawnTime').textContent=left.toFixed(1); }

    if(player.place === 6){
      for(const s of swords){
        if(s.taken) continue;
        if(Math.hypot(s.x-player.x, s.z-player.z) < 1.8 && Math.abs(s.y-player.y) < 2.2){
          s.taken = true;
          playerHasSword = true;
          toast('⚔ Меч получен!');
        }
      }
    }

    for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.dx*60*s;b.z+=b.dz*60*s;b.life-=s;if(b.life<=0)bullets.splice(i,1);}
    for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.dx*30*s;r.z+=r.dz*30*s;r.y+=r.dy*30*s;r.life-=s;if(r.life<=0){explode(r.x,r.y,r.z);rockets.splice(i,1);}}
    for(let i=explosions.length-1;i>=0;i--){const e=explosions[i];e.life-=s;e.r+=s*18;if(e.life<=0)explosions.splice(i,1);}
    if(now-player.lastDamage>5000 && player.health<100) player.health=Math.min(100,player.health+s*8);
    for(const b of spawnBuildings){if(b._dead && now>=b._respawnAt) b._dead=false;}

    // Оптимизация мультиплеера: отправка реже
    if(now-lastMoveSend>160){ lastMoveSend=now; wsSend({type:'move',x:player.x,y:player.y,z:player.z,yaw:player.yaw,walking:player.walking,walkPhase:player.walkPhase,place:player.place,health:player.health}); }

    const camDirX=Math.sin(camYaw), camDirZ=Math.cos(camYaw);
    const cx=player.x+camDirX*camDistance;
    const cz=player.z+camDirZ*camDistance;
    const cy=player.y+2.2+Math.sin(camPitch)*camDistance*0.45;

    gl.clearColor(skyCol[0],skyCol[1],skyCol[2],1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);

    const view=matLook(cx,cy,cz,player.x,player.y+0.9,player.z);
    proj=persp(Math.PI/3,c.width/c.height,0.1,600);
    gl.useProgram(pr);
    gl.uniformMatrix4fv(uV,false,view); gl.uniformMatrix4fv(uP,false,proj);
    gl.uniform3f(uLight,0.45,1.0,0.35); gl.uniform3f(uCam,cx,cy,cz); gl.uniform3f(uFog,skyCol[0],skyCol[1],skyCol[2]);
    gl.bindBuffer(gl.ARRAY_BUFFER,bP);gl.enableVertexAttribArray(aPos);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bN);gl.enableVertexAttribArray(aNor);gl.vertexAttribPointer(aNor,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,bC);gl.enableVertexAttribArray(aCol);gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,worldCount);

    dPv.length=0;dNv.length=0;dCv.length=0;
    for(const b of spawnBuildings){
      if(!b._dead){ lbox(b.x,0,b.z,0,0,b.h/2,0,b.w/2,b.h/2,b.d/2,b.col); lbox(b.x,0,b.z,0,0,b.h+0.3,0,b.w/2+0.3,0.3,b.d/2+0.3,[0.4,0.35,0.3]); }
      else { for(let k=0;k<8;k++){const ang=k*0.8;const r=3+k*0.7;lbox(b.x+Math.cos(ang)*r,0,b.z+Math.sin(ang)*r,ang*0.5,0,0.3+(k%3)*0.5,0,0.6,0.6,0.6,[b.col[0]*0.5,b.col[1]*0.5,b.col[2]*0.5]);} lbox(b.x,0,b.z,0,0,0.2,0,4,0.4,4,[0.3,0.28,0.25]); }
    }
    if(!player.dead) drawR6(player.x, player.y, player.z, player.yaw, player.walkPhase, player.walking, myUser);
    otherPlayers.forEach(p=>{if(p.place!==player.place) return; drawR6(p.x,p.y,p.z,p.yaw,p.walkPhase,p.walking,{equipped:p.equipped||{}});});

    for(const s of swords){
      if(s.taken) continue;
      lbox(s.x,0,s.z,0, 0, s.y+0.3, 0, 0.07,0.4,0.07, [0.35,0.22,0.1]);
      lbox(s.x,0,s.z,0, 0, s.y+0.95, 0, 0.05,0.8,0.025,[0.78,0.78,0.82]);
    }

    for(const b of bullets) lbox(b.x,0,b.z,0,0,b.y,0,0.06,0.06,0.06,[1,0.95,0.3]);
    for(const r of rockets) lbox(r.x,0,r.z,0,0,r.y,0,0.12,0.12,0.12,[1,0.5,0.1]);
    for(const e of explosions){const k=e.life/e.maxLife;const size=0.5+(1-k)*3;lbox(e.x,0,e.z,0,0,e.y,0,size,size,size,[1,0.5+(1-k)*0.3,0.1]);}
    uploadDyn();
    gl.bindBuffer(gl.ARRAY_BUFFER,dP);gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,dN);gl.vertexAttribPointer(aNor,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,dC);gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.TRIANGLES,0,dPv.length/3);
    document.getElementById('st').textContent='X:'+player.x.toFixed(0)+' Y:'+player.y.toFixed(1)+' Z:'+player.z.toFixed(0)+' | ❤'+Math.round(player.health);
  }
  requestAnimationFrame(loop);
}

connectWS();
requestAnimationFrame(loop);
</script></body></html>
